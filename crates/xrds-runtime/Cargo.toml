[package]
name = "xrds-runtime"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib"]

[dependencies]
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true
tokio.workspace = true

petgraph="0.8.3"
mint = "0.5.9"
winit = { version = "0.30.5", default-features = false, features = [
    "ahash",
    "bytemuck",
    "memmap2",
    "percent-encoding",
    "rwh_06",
    "sctk",
    "sctk-adwaita",
    "mint",
] }
xrds-audio = { workspace = true }
xrds-components = { workspace = true }
xrds-openxr = { workspace = true }
xrds-scene-graph = { workspace = true }
bevy = { workspace = true }
avian3d = { workspace = true }
bevy_rich_text3d = { workspace = true }
bevy_fontmesh = { workspace = true }
bevy_mod_outline = "0.11.0"
gltf = "1.4.1"

[build-dependencies]
cbindgen = "0.27.0"

[target.'cfg(unix)'.dependencies]
winit = { version = "0.30.5" }

# xrds-net has desktop-only C deps (curl, ffmpeg, quiche, webrtc, libunftp).
# Exclude it from Android where none of those are available or needed.
[target.'cfg(not(target_os = "android"))'.dependencies]
xrds-net = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.5", features = ["android-native-activity"] }
