[package]
name = "xrds-openxr"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib"]

[features]
preview_window = []
default = ["preview_window"]

[dependencies]
ash = { workspace = true }
anyhow = { workspace = true }
bevy = { workspace = true }
log = { workspace = true }
wgpu = { workspace = true }
wgpu-hal = { workspace = true }

# Desktop: build the OpenXR loader from bundled C source (cmake).
[target.'cfg(not(target_os = "android"))'.dependencies]
openxr = { version = "0.19.0", features = ["linked", "static", "mint"] }

# Android: dynamic-link against the pre-built libopenxr_loader.so in
# android/quest/libs/arm64-v8a/. The linker search path is in .cargo/config.toml.
[target.'cfg(target_os = "android")'.dependencies]
openxr = { version = "0.19.0", features = ["linked", "mint"] }
android_system_properties = "0.1"
# AHardwareBuffer_acquire/_release for imported video frames. Vulkan imports the
# buffer but refcounting it is an NDK concern, so ash cannot cover it.
ndk-sys = { version = "0.6", features = ["media"] }

[target.'cfg(windows)'.dependencies]
winreg = { version = "0.55.0" }
serde = { version = "1.0.228" }
serde_json = { version = "1.0.145" }
libloading = { version = "0.9.0" }
