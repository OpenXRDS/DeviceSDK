[package]
name = "xrds-net"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Protocol-agnostic client networking for XR apps (HTTP/WS/MQTT/CoAP/QUIC/FTP + WebRTC), plus a signaling/WS/FTP server for local dev and testing."
repository = "https://github.com/OpenXRDS/DeviceSDK"

[lib]
crate-type = ["lib"]

# Cargo skips a target whose required-features are unmet, instead of failing the build.
[[test]]
name = "webrtc_integration"
required-features = ["protocol-webrtc"]

[features]
default = [
    "ftp-server",
    "protocol-http",
    "protocol-coap",
    "protocol-mqtt",
    "protocol-ws",
    "protocol-quic",
    "protocol-ftp",
    "protocol-webrtc",
]
# FTP *server* (libunftp). Desktop/dev only — excluded on Android, where the
# native provisioning is unavailable and an XR client never hosts FTP. The
# ftp/sftp *client* transfer path (suppaftp) is separate and unaffected.
ftp-server = ["dep:libunftp", "dep:unftp-sbe-fs"]
# One feature per protocol *dependency* — see docs/xrds-net-protocol-features-plan.md.
#
# All default-on, so nobody loses a protocol by accident; narrowing is an explicit
# `default-features = false`. `PROTOCOLS` and `scheme_to_protocol` stay total in every
# configuration, so a URL always parses and a disabled protocol reports which feature to
# enable (Phase 1's `UnsupportedHandler::feature_disabled`).
#
# Two riders, because handlers group by dependency rather than by scheme:
#   * `file://` is served by the HTTP handler, so it rides `protocol-http`.
#   * QUIC and HTTP/3 are both `quiche`, so they cannot be separated.
protocol-http  = ["dep:reqwest"]
protocol-coap  = ["dep:coap", "dep:coap-lite"]
protocol-mqtt  = ["dep:rumqttc"]
protocol-ws    = ["dep:tokio-tungstenite"]
protocol-quic  = ["dep:quiche"]                       # QUIC *and* HTTP/3
protocol-ftp   = ["dep:suppaftp"]                     # client transfer; server is `ftp-server`
# WebRTC signalling runs over WebSocket, so this is not independent of protocol-ws.
protocol-webrtc = ["dep:webrtc", "protocol-ws"]

[dependencies]
tokio = { version = "^1.32", features = ["full", "test-util"] }
tokio-tungstenite = { version = "*", features = ["rustls-tls-webpki-roots"], optional = true } # rustls enables wss:// — see docs/done/xrds-net-crypto-consolidation.md
url = "2.5.4"
mio = "1.0.3"
random-string = "1.1.0"                                         # for scid (QUIC)
# `v4` declared explicitly: `common/mod.rs` calls `Uuid::new_v4()` directly. It used to
# compile only because the always-on `webrtc` dependency happened to enable that feature —
# the moment webrtc became optional, `--no-default-features` failed in `uuid`. Never rely on
# another crate's feature selection for a feature you use yourself.
uuid = { version = "1.15.1", features = ["v4"] }                 # uuid
base64 = "0.22.1"
serde_json = "1.0.139"
serde = "1.0.218"
async-trait = "0.1.86"
futures = "0.3.31"
futures-util = "0.3"
anyhow = "1.0.97"
bytes = "1"
log = "0.4.28"
pretty_env_logger = "0.5.0"

reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls-webpki-roots",
] , optional = true } # http / https — see docs/done/xrds-net-crypto-consolidation.md (replaces curl)
coap = { version = "0.19.1", optional = true }  # coap
coap-lite = { version = "0.11.3", optional = true }  # coap
suppaftp = { version = "^6", features = ["rustls"], optional = true }  # ftp / sftp — see docs/done/xrds-net-crypto-consolidation.md
rumqttc = { version = "0.24.0", optional = true }  # mqtt
quiche = { version = "=0.24.6", optional = true }  # quic / http3 (pinned exact: see [patch.crates-io] in workspace Cargo.toml)
webrtc = { version = "0.12.0", optional = true }          # webRTC (feature: protocol-webrtc)

rustls = { version = "0.23.10", default-features = false, features = [
    "std",
    "ring",
] } #tls
once_cell = "1.20"

libunftp = { version = "0.20.3", optional = true }    # ftp server (feature: ftp-server)
unftp-sbe-fs = { version = "0.2.0", optional = true } # ftp server (feature: ftp-server)

ogg = "0.8"       # audio container muxing (receive-side Opus save; no codec work)
rand = "0.8"      # random number generation
chrono = "0.4.42" # date and time

[dev-dependencies]
serial_test = "3.0"
rcgen = "0.13"     # self-signed cert for the QUIC test server (test-only)
