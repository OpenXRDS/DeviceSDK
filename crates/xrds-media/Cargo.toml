[package]
name = "xrds-media"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Media I/O for XRDS: camera/microphone capture and encoding for transport (desktop), software video playback (desktop), and hardware video decode on Android. No networking dependencies."

[features]
default = []
# Synthetic, hardware-free sources for downstream tests (and this crate's own
# Tier 2 tests). See docs/done/xrds-net-capture-decoupling.md.
test-util = []
# JPEG->H264 and PCM->Opus encoding, for feeding xrds-net's already-encoded
# media sources (VideoSource::EncodedH264, AudioSource). xrds-net itself never
# depends on a codec library — see docs/done/xrds-net-capture-decoupling.md.
transcoding = ["dep:ffmpeg-next", "dep:opus"]
# File -> RGBA frames, for playback rather than transport. Separate from
# `transcoding` because it is the opposite direction and a different consumer:
# transcoding feeds the wire, playback feeds a texture. Both happen to need
# ffmpeg, which is why they share a dependency and not a flag.
playback = ["dep:ffmpeg-next"]

[dependencies]
log = "0.4"

# Camera and microphone capture — desktop only.
#
# Not merely unused on Android but unlinkable there: nokhwa's native backend and
# cpal's (via oboe) drag in a JNI/C++ stack that fails at link time, which is how
# this was found. A headset has neither a webcam this crate can open nor a cpal
# device, so target-gating costs nothing and keeps the Android artifact honest.
[target.'cfg(not(target_os = "android"))'.dependencies.nokhwa]
version = "0.10.7"
default-features = false
features = ["input-native", "output-threaded"]

[target.'cfg(not(target_os = "android"))'.dependencies.cpal]
version = "=0.14.0"

# Transcoding (optional, see the `transcoding` feature).
[dependencies.ffmpeg-next]
version = "8.1.0"
optional = true

[dependencies.opus]
version = "0.3.0"
optional = true

# Hardware video decode on Android (AMediaCodec -> AHardwareBuffer). Not behind a
# feature: it is target-gated, and the `media` feature only adds bindings to NDK
# headers that are already present on the platform. The version matches the
# `ndk-sys` android-activity and winit already pull in, so Cargo unifies it.
[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = { version = "0.6", features = ["media"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
pretty_env_logger = "0.5.0"
# Test-only: lets the opt-in decode test write frames out as PNG, so a decode
# result can be *looked at* rather than inferred from a mean pixel value. Already
# in the workspace tree via Bevy, so this costs no extra build.
image = { version = "0.25", default-features = false, features = ["png"] }
