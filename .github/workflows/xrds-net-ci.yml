name: xrds-net CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "crates/xrds-net/**"
      # xrds-media was extracted out of xrds-net and was covered by nothing at all,
      # despite the net stack depending on the code that moved there.
      - "crates/xrds-media/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/xrds-net-ci.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # This job compiles the *whole* workspace, and `apps/xrds-editor/src-tauri` is a
      # member, so the dependency set is much wider than xrds-net's own:
      #
      #   cmake, perl                  quiche's vendored BoringSSL
      #   libasound2-dev, libudev-dev  Bevy audio (alsa-sys via rodio/cpal) and input
      #   libav*-dev, libpostproc-dev  xrds-media transcoding (ffmpeg)
      #   libgtk-3-dev                 rfd file dialogs; covers glib/gio/gdk/atk/cairo/pango
      #   libwebkit2gtk-4.1-dev        wry's webview; covers javascriptcore + soup3
      #   clang, libssl-dev, libxcb-glx0-dev   per the README's documented list
      #
      # Every one of these is a pkg-config lookup inside a *build script*, so a missing
      # header fails the build long before any of our code is type-checked — the first two
      # attempts at this job died in `alsa-sys` and then `glib-sys` respectively.
      - name: Install native build deps (quiche, Bevy, ffmpeg, GTK/WebKit)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Bounded and non-interactive on purpose. The unhardened form of this step hung
          # for 70 minutes on a runner: apt has no default network timeout, so a stalled
          # mirror waits forever, and any debconf prompt blocks on stdin that never comes.
          sudo -E apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo -E apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 cmake perl clang libssl-dev libasound2-dev libudev-dev libxcb-glx0-dev libavcodec-dev libavformat-dev libavutil-dev libavdevice-dev libavfilter-dev libswresample-dev libswscale-dev libpostproc-dev libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0" # keep in sync with the repo's actual toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --tests

  clippy:
    name: clippy (xrds-net)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native build deps (quiche/BoringSSL)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo -E apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 cmake perl
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p xrds-net --all-targets -- -D warnings

  test-unit:
    name: test (xrds-net --lib)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A real gate now: no `continue-on-error`. Every test that reaches a public server is
    # tagged `#[ignore]` and runs in `test-live-network` below, so a red mark here means our
    # code is broken rather than someone else's server being down.
    #
    # This replaces the long-standing stopgap (docs/done/xrds-net-release-readiness.md
    # Phase 5): the suite used to hit mosquitto/rebex/coap.me/echo.websocket.org/rust-lang.org
    # and was allowed to fail, which meant it reported nothing either way.
    steps:
      - uses: actions/checkout@v4
      - name: Install native build deps (quiche/BoringSSL)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo -E apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 cmake perl
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p xrds-net --lib

  # The tests that need the public internet: mosquitto, rebex, coap.me,
  # echo.websocket.org, rust-lang.org, quic.nginx.org, cloudflare-quic.com, litespeedtech.
  #
  # Allowed to fail, deliberately — a red mark here usually means someone else's server is
  # down, which is worth *seeing* but must never block a merge. Keeping them visible rather
  # than deleting them preserves the only coverage we have of real-world protocol behaviour.
  test-live-network:
    name: test (xrds-net live network)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install native build deps (quiche/BoringSSL)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo -E apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 cmake perl
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      # Single-threaded: several of these share a public broker topic, and running them
      # concurrently makes them interfere with each other rather than with the network.
      - run: cargo test -p xrds-net --lib -- --ignored --test-threads=1

  test-webrtc-integration:
    name: test (xrds-net webrtc_integration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install native build deps (quiche/BoringSSL)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo -E apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 cmake perl
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      # `#[serial(webrtc)]`-serialized within the file — must run
      # single-threaded, same as every manual run this session.
      - run: cargo test -p xrds-net --test webrtc_integration -- --test-threads=1

  # Every feature combination is a distinct compilation, so a broken one stays invisible
  # until a consumer tries it. This job exists because gating `protocol-webrtc` immediately
  # surfaced two latent bugs that the default build could never have shown:
  #
  #   - `uuid` was used with `Uuid::new_v4()` but declared without its `v4` feature; it only
  #     compiled because the always-on `webrtc` dependency happened to enable it.
  #   - The webrtc examples resolved `WebRTCClient` only through Cargo's cross-member feature
  #     unification, not through any declaration of their own.
  #
  # `--all-targets` is deliberate: it builds tests too, which is where the `webrtc_integration`
  # target needed `required-features` to be skipped rather than fail.
  feature-matrix:
    name: features (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # All on (what every consumer gets) and all off (the floor).
          - name: default
            flags: ""
          - name: none
            flags: "--no-default-features"
          # Each protocol alone. This is the shape the feature family exists to serve, and
          # the only way a single protocol's cfg gaps become visible.
          - name: http-only
            flags: "--no-default-features --features protocol-http"
          - name: coap-only
            flags: "--no-default-features --features protocol-coap"
          - name: mqtt-only
            flags: "--no-default-features --features protocol-mqtt"
          - name: ws-only
            flags: "--no-default-features --features protocol-ws"
          - name: quic-only
            flags: "--no-default-features --features protocol-quic"
          - name: ftp-only
            flags: "--no-default-features --features protocol-ftp"
          - name: webrtc-only
            flags: "--no-default-features --features protocol-webrtc"
          - name: ftp-server-only
            flags: "--no-default-features --features ftp-server"
    steps:
      - uses: actions/checkout@v4
      # Only quiche's BoringSSL needs native deps here — this job builds xrds-net alone, not
      # the workspace, so Bevy's and the editor's system libraries are not involved.
      - name: Install native build deps (quiche/BoringSSL)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo -E apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 cmake perl
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: features-${{ matrix.name }}
      - name: cargo check
        run: cargo check -p xrds-net ${{ matrix.flags }} --all-targets
      # Clippy too: a cfg'd-out branch is exactly where dead code and unused imports hide,
      # and CI already gates the default build on -D warnings.
      - name: cargo clippy
        run: cargo clippy -p xrds-net ${{ matrix.flags }} --all-targets -- -D warnings
