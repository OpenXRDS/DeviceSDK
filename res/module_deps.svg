<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="DeviceSDK crate dependency diagram: the xrds-app and xrds-editor applications depend on the xrds-runtime facade, which depends on xrds-scene-graph, xrds-components, xrds-openxr and xrds-net; xrds-media is deliberately decoupled from xrds-net and xrds-audio is deprecated and excluded from the workspace.">

  <defs>
    <marker id="arrowSolid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c7d73"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8985"/>
    </marker>
  </defs>

  <!-- ground: fixed so the figure reads identically on GitHub light and dark themes -->
  <rect x="0" y="0" width="1200" height="900" fill="#f4f6f5"/>

  <!-- ============ layer labels ============ -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.3" fill="#5c6864">
    <text x="100" y="42">APPLICATIONS</text>
    <text x="100" y="213">FACADE</text>
    <text x="100" y="383">DOCUMENT LAYER</text>
    <text x="100" y="533">FOUNDATION</text>
    <text x="100" y="690">ISOLATED / DEPRECATED</text>
  </g>

  <!-- ============ edges: workspace path dependencies ============ -->
  <g fill="none" stroke="#1c7d73" stroke-width="2" marker-end="url(#arrowSolid)">
    <!-- xrds-app -> xrds-runtime -->
    <path d="M270,150 L270,194 L444,194 L444,222"/>
    <!-- xrds-editor -> xrds-runtime -->
    <path d="M930,150 L930,194 L756,194 L756,222"/>
    <!-- xrds-runtime -> xrds-scene-graph -->
    <path d="M500,336 L480,390" stroke-width="2.4"/>
    <!-- xrds-runtime -> xrds-openxr -->
    <path d="M690,336 L650,540"/>
    <!-- xrds-runtime -> xrds-net -->
    <path d="M780,336 L900,540"/>
    <!-- xrds-runtime -> xrds-components (routed through the left margin, clear of the document layer) -->
    <path d="M380,300 L62,300 L62,592 L94,592"/>
    <!-- xrds-scene-graph -> xrds-components -->
    <path d="M340,484 L282,540"/>
  </g>

  <!-- ============ edges: direct deps that bypass the facade ============ -->
  <g fill="none" stroke="#7d8985" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDashed)">
    <!-- xrds-app -> xrds-scene-graph -->
    <path d="M200,150 L200,440 L294,440"/>
    <!-- xrds-app -> xrds-openxr -->
    <path d="M140,150 L140,498 L516,498 L516,540"/>
    <!-- xrds-editor -> xrds-scene-graph -->
    <path d="M1000,150 L1000,368 L600,368 L600,390"/>
    <!-- xrds-editor -> xrds-components -->
    <path d="M1100,150 L1166,150 L1166,668 L430,668 L430,600 L406,600"/>
  </g>

  <!-- ============ applications ============ -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="100" y="58" width="340" height="92" rx="4" fill="#f5ead8" stroke="#a9772c" stroke-width="1.6"/>
    <text x="270" y="92" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#16211f">xrds-app</text>
    <text x="270" y="114" text-anchor="middle" font-size="12.5" fill="#5c6864">Standalone XR runtime application</text>
    <text x="270" y="132" text-anchor="middle" font-size="12.5" fill="#5c6864">Android &amp; desktop · loads scene.json</text>

    <rect x="760" y="58" width="340" height="92" rx="4" fill="#f5ead8" stroke="#a9772c" stroke-width="1.6"/>
    <text x="930" y="92" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#16211f">xrds-editor</text>
    <text x="930" y="114" text-anchor="middle" font-size="12.5" fill="#5c6864">GUI scene editor (Tauri / wry)</text>
    <text x="930" y="132" text-anchor="middle" font-size="12.5" fill="#5c6864">apps/xrds-editor/src-tauri</text>
  </g>

  <!-- ============ facade ============ -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="380" y="228" width="440" height="108" rx="4" fill="#dceeeb" stroke="#1c7d73" stroke-width="2"/>
    <text x="600" y="266" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#16211f">xrds-runtime</text>
    <text x="600" y="289" text-anchor="middle" font-size="12.5" fill="#5c6864">Bevy app assembly · xrds_api facade · viewer</text>
    <text x="600" y="306" text-anchor="middle" font-size="12.5" fill="#5c6864">Re-exports sub-crates as the sdk and net modules</text>
    <text x="600" y="326" text-anchor="middle" font-size="12" font-style="italic" fill="#5c6864">Central hub — apps target this facade instead of composing crates themselves</text>
  </g>

  <!-- ============ document layer ============ -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="300" y="396" width="340" height="88" rx="4" fill="#e8edeb" stroke="#b9c2be" stroke-width="1.4"/>
    <text x="470" y="430" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#16211f">xrds-scene-graph</text>
    <text x="470" y="452" text-anchor="middle" font-size="12.5" fill="#5c6864">Authored scene document with stable ids —</text>
    <text x="470" y="469" text-anchor="middle" font-size="12.5" fill="#5c6864">deterministic glTF export target</text>
  </g>

  <!-- ============ foundation ============ -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="100" y="546" width="300" height="92" rx="4" fill="#e8edeb" stroke="#b9c2be" stroke-width="1.4"/>
    <text x="250" y="580" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#16211f">xrds-components</text>
    <text x="250" y="602" text-anchor="middle" font-size="12.5" fill="#5c6864">ECS components: cameras, lights,</text>
    <text x="250" y="619" text-anchor="middle" font-size="12.5" fill="#5c6864">materials, world UI, interaction zones</text>

    <rect x="450" y="546" width="300" height="92" rx="4" fill="#e8edeb" stroke="#b9c2be" stroke-width="1.4"/>
    <text x="600" y="580" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#16211f">xrds-openxr</text>
    <text x="600" y="602" text-anchor="middle" font-size="12.5" fill="#5c6864">OpenXR session, swapchain, render/blit,</text>
    <text x="600" y="619" text-anchor="middle" font-size="12.5" fill="#5c6864">hand input, Android bootstrap</text>

    <rect x="800" y="546" width="300" height="92" rx="4" fill="#e8edeb" stroke="#b9c2be" stroke-width="1.4"/>
    <text x="950" y="580" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#16211f">xrds-net</text>
    <text x="950" y="602" text-anchor="middle" font-size="12.5" fill="#5c6864">Protocol-agnostic client (HTTP/WS/MQTT/</text>
    <text x="950" y="619" text-anchor="middle" font-size="12.5" fill="#5c6864">CoAP/QUIC/WebRTC) + signaling server</text>
  </g>

  <!-- ============ isolated / deprecated ============ -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="100" y="703" width="460" height="104" rx="4" fill="#ffffff" stroke="#7d8985" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="330" y="737" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#16211f">xrds-media</text>
    <text x="330" y="759" text-anchor="middle" font-size="12.5" fill="#5c6864">Desktop-only camera / mic capture + transcoding.</text>
    <text x="330" y="776" text-anchor="middle" font-size="12.5" fill="#5c6864">Deliberately does not depend on xrds-net — consumers</text>
    <text x="330" y="793" text-anchor="middle" font-size="12.5" fill="#5c6864">wire the encoded streams to it themselves.</text>

    <rect x="640" y="703" width="460" height="104" rx="4" fill="#f4e3de" stroke="#9c5142" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="870" y="737" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#16211f">xrds-audio</text>
    <text x="870" y="759" text-anchor="middle" font-size="12.5" font-weight="600" fill="#9c5142">DEPRECATED · excluded from the workspace</text>
    <text x="870" y="777" text-anchor="middle" font-size="12.5" fill="#5c6864">Duplicates Bevy's built-in spatial audio;</text>
    <text x="870" y="794" text-anchor="middle" font-size="12.5" fill="#5c6864">no crate references it.</text>
  </g>

  <!-- ============ legend ============ -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5c6864">
    <line x1="100" y1="856" x2="132" y2="856" stroke="#1c7d73" stroke-width="2.5"/>
    <text x="142" y="860">workspace path dependency</text>

    <line x1="352" y1="856" x2="384" y2="856" stroke="#7d8985" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="394" y="860">direct dependency that bypasses the facade</text>

    <rect x="720" y="849" width="22" height="15" rx="2" fill="#ffffff" stroke="#7d8985" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="752" y="860">not part of the dependency graph</text>
  </g>

</svg>
