[package]
name = "xrds"
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"
keywords = ["XR"]
repository = "https://github.com/OpenXRDS/DeviceSDK"
homepage = "https://github.com/OpenXRDS"
authors = ["OpenXRDS developers"]

[workspace]
members = ["crates/*", "apps/xrds-editor-tauri/src-tauri", "apps/xrds-app"]

[workspace.dependencies.xrds-gltf]
package = "xrds-gltf"
path = "./crates/xrds-gltf"

[workspace.dependencies.xrds-audio]
package = "xrds-audio"
path = "./crates/xrds-audio"

[workspace.dependencies.xrds-components]
package = "xrds-components"
path = "./crates/xrds-components"

# [workspace.dependencies.xrds-graphics]
# package = "xrds-graphics"
# path = "./crates/xrds-graphics"

[workspace.dependencies.xrds-net]
package = "xrds-net"
path = "./crates/xrds-net"

[workspace.dependencies.xrds-openxr]
package = "xrds-openxr"
path = "./crates/xrds-openxr"

[workspace.dependencies.xrds-runtime]
package = "xrds-runtime"
path = "./crates/xrds-runtime"

[workspace.dependencies.xrds-scene-graph]
package = "xrds-scene-graph"
path = "./crates/xrds-scene-graph"

[workspace.dependencies.xrds-internal]
package = "xrds-internal"
path = "./crates/xrds-internal"

[workspace.dependencies]
tokio = { version = "1.43.0", features = ["rt-multi-thread", "sync", "macros"] }
anyhow = "1.0.95"
env_logger = "0.11.6"
log = "0.4.25"
bevy = { version = "0.17.2", features = ["jpeg", "mp3", "wav"] }
wgpu = { version = "26.0.1", default-features = false, features = ["wgsl", "vulkan", "vulkan-portability"] }
wgpu-hal = { version = "26.0.1", features = ["vulkan"] }
ash = "0.38.0"
glam = { version = "0.29.2", features = ["bytemuck"] }
bevy_rich_text3d = "0.5.0"
bevy_fontmesh = "0.1.1"
bevy_svg = "0.17.0"

[target.'cfg(windows)'.dependencies]
winreg = { version = "0.55.0" }

[dependencies]
xrds-internal = { workspace = true }
xrds-scene-graph = { workspace = true }

[dev-dependencies]
bevy = { workspace = true }
wgpu = { workspace = true }
rand = { version = "0.9.2" }
xrds-net = { workspace = true }
