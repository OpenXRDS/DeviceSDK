[package]
name = "xrds-editor"
version = "0.1.0"
description = "GUI editor application built on top of the XRDS SDK"
authors = ["gganjang"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["rlib"]

[features]
default = ["xrds-runtime/ftp-server"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tokio = { workspace = true }
# default-features = false + the forward above: the editor is desktop-only
# and keeps ftp-server, but an un-gated default-featured edge here would leak
# into Android's shared feature resolution for xrds-runtime/xrds-net even
# though the editor itself never targets Android — see
# docs/done/xrds-net-android-shipping.md Phase 3.
xrds-runtime = { workspace = true, default-features = false }
xrds-scene-graph = { workspace = true }
# Reads a video's codec at import. The editor must refuse a container whose codec
# a headset cannot decode, or it happily imports something that plays nothing.
xrds-media = { workspace = true, features = ["playback"] }
xrds-components = { workspace = true }
bevy = { workspace = true }
bevy_mod_outline = "0.11.0"
rfd = "0.15"
# OpenEXR decoding, for the environment-map import contract (see
# docs/editor-task-queue-and-hdr-conversion.md). `.exr` is what authors actually
# download — ambientCG and Poly Haven ship it — and nothing in the tree could read
# one: Bevy's `exr` feature is off and the `exr` crate was absent entirely.
#
# Declared here rather than as a Bevy feature on the workspace so the decoder stays
# out of the Quest APK. `xrds-app` does not depend on the editor, so this reaches
# only desktop builds; enabling `bevy/exr` at the workspace level would ship an
# OpenEXR decoder to a headset that only ever loads converted KTX2.
#
# default-features = false: `image` otherwise pulls in every codec it has, and the
# ones we want are already provided through Bevy.
image = { version = "0.25", default-features = false, features = ["exr"] }
# KTX2 writing for the environment-map converter (env_convert.rs). Handles the
# container, the data-format descriptor and the face/mip layout — fiddly, easy to
# get subtly wrong, and not where the interesting work is.
#
# default-features = false drops all five encoder bindings (bc7enc, ISPC,
# Compressonator, etcpak, astcenc) and their C++ toolchain requirement. It does
# still pull zstd-sys, which compiles C; enable the encoders only if BC6H desktop
# compression is ever wanted.
ctt = { version = "0.5", default-features = false }
half = "2"
rayon = "1"
wgpu = { workspace = true }
wry = "0.55"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["shape"] }
gtk = "0.18"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
