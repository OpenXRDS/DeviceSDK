[package]
name = "xrds-editor-tauri"
version = "0.1.0"
description = "GUI editor application built on top of the XRDS SDK"
authors = ["gganjang"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["devtools"] }
tokio = { workspace = true }
xrds-runtime = { workspace = true }
xrds-scene-graph = { workspace = true }
xrds-gltf = { workspace = true }
bevy = { workspace = true }
bevy_mod_outline = "0.11.0"
rfd = "0.15"
